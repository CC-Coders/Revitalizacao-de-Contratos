<div class="row">
<div class="col-md-4">
<div class="form-input">
    <label>Origem do Contrato:</label><select name="origemContrato"
        id="origemContrato" class="form-control inputInfoChamado">
                <option value="">Selecione</option>
                <option value="Novo">Novo</option>
                <option value="Aditivos">Aditivos</option>
                <option value="Rescisões">Rescisões</option>
    </select>
</div>
</div>
<div class="col-md-4">
<div class="form-input">
    <label>Modelo de Contrato:</label><select name="modeloContrato"
        id="modeloContrato" class="form-control inputInfoChamado">
                <option value="">Selecione</option>
                <option value="Modelo Castilho">Modelo Castilho</option>
                <option value="Contrato fora do modelo">Contrato fora do modelo</option>
    </select>
</div>
</div>
<div class="col-md-4">
<div class="form-input">
    <label>Tipo de Contrato:</label><select name="tipoContrato"
        id="tipoContrato" class="form-control inputInfoChamado">
           <option value="">Selecione</option>
                <option value="Ferrovias - Locação de Equipamento">Ferrovias - Locação de Equipamento</option>
                <option value="Ferrovias – Locação de Imóvel">Ferrovias – Locação de Imóvel</option>
                <option value="Locação de Container">Locação de Container</option>
                <option value="Locação de Equipamento">Locação de Equipamento</option>
                <option value="Locação de Imóvel">Locação de Imóvel</option>
                <option value="Locação de Sanitários">Locação de Sanitários</option>
                <option value="Prestação de Serviços">Prestação de Serviços</option>
                <option value="Transporte de Material">Transporte de Material</option>
                <option value="Transporte de Funcionários">Transporte de Funcionários</option>
    </select>
</div>
</div>

                       <div class="row">
                      <div class="col-md-6">
                            <div class="form-input">
                                <label>Obra:</label><strong class="strongAlert">*</strong><select name="obra"
                                    id="obra" class="form-control inputInfoChamado">
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-input">
                                <label>Locador:</label> <strong class="strongAlert">*</strong>
                                <select name="locador" id="locador" class="form-control inputInfoChamado">
                                </select>
                            </div>
                        </div>
                        <br/>
                    </div>

                     <div class="row">
                      <div class="col-md-6">

                                    class="form-control inputInfoChamado" />
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-input">
                               <label>Representante:</label><strong class="strongAlert">*</strong>  <input type="text" id="representante" name="representante"
                                    class="form-control inputInfoChamado" />
                            </div>
                        </div>
                        <br/>
                    </div>
                    <br/>
                     <div class="row">
                      <div class="col-md-6">
                            <div class="form-input">
                                <label>Contratante Principal:</label><strong class="strongAlert">*</strong>  <input type="text" id="contratantePrincipal" name="contratantePrincipal"
                                    class="form-control inputInfoChamado" />
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-input">
                               <label>Endereço do Imóvel:</label><strong class="strongAlert">*</strong>  <input type="text" id="enderecoImovel" name="enderecoImovel"
                                    class="form-control inputInfoChamado" />
                            </div>
                        </div>
                    </div>
                                            <br/>

                      <div class="col-md-6">
                            <div class="form-input">

                                    class="form-control inputInfoChamado" />
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-input">
                               <label>Finalidade da Locação:</label><strong class="strongAlert">*</strong>  <input type="text" id="finalidadeLocacao" name="finalidadeLocacao"
                                    class="form-control inputInfoChamado" />
                            </div>
                        </div>
                    </div>
                                  <br/>

                      <div class="col-md-6">

                                <label>Período de Locação:</label><strong class="strongAlert">*</strong>  <input type="text" id="periodoLocacao" name="periodoLocacao"
                                    class="form-control inputInfoChamado" />
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-input">

                                    class="form-control inputInfoChamado" />
                            </div>
                        </div>
                    </div>
                                  <br/>
                       <div class="row">
                      <div class="col-md-6">
                            <div class="form-input">
                                <label>Valor do Caução:</label><strong class="strongAlert">*</strong>  <input type="text" id="valorCaucao" name="valorCaucao"
                                    class="form-control inputInfoChamado" />
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-input">
                               <label>Janela de Pagamento:</label><strong class="strongAlert">*</strong>  <input type="text" id="janelaPagamento" name="janelaPagamento"
                                    class="form-control inputInfoChamado" />
                            </div>
                        </div>
                    </div>
